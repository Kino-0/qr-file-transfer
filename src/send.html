<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR送信</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;background:#333;color:#eee;font:15px system-ui,sans-serif}
  #bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:8px}
  #st{font-variant-numeric:tabular-nums}
  canvas{image-rendering:pixelated}
</style>
<div id="bar">
  <input type="file" id="f">
  <label>速度 <input type="range" id="sp" min="2" max="30" value="12"> <output id="fo">12</output> fps</label>
  <label>密度 <select id="ver"><option value="15">最低<option value="20">低<option value="25" selected>標準<option value="32">高<option value="40">最高</select></label>
  <span id="st">ファイルを選択してください</span>
</div>
<canvas id="cv"></canvas>
<script type="module">
/*@inline lean-qr*/
const CAP = { 15: 520, 20: 858, 25: 1273, 32: 1952, 40: 2953 };  // 誤り訂正Lでのバイト容量
const HDR = 11;  // [F2][ID 4B][通番 4B][ブロック数 2B]

const $ = id => document.getElementById(id);
const cv = $('cv');
const T = new Uint32Array(256).map((_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ n >>> 1 : n >>> 1; return n; });
const crc = b => { let c = -1; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ c >>> 8; return (c ^ -1) >>> 0; };
// 補完フレーム q が含むブロックの集合(ビットマスク)。受信側と同じ列を作る。seedに対して非線形なPRNGが必須
const mask = (q, K, m) => {
  for (let i = 0, a = q; i < m.length; i++) {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    m[i] = t ^ t >>> 14;
  }
  if (K & 31) m[m.length - 1] &= (1 << (K & 31)) - 1;
  return m;
};
let src, K = 0, L, CH, ver, id, seq = 0, last = 0, t0 = 0, raf, size = 0, run = 0;

async function start() {  // ファイルか密度が変わるたびに最初から送り直す
  const file = $('f').files[0], my = ++run;
  if (!file) return;
  cancelAnimationFrame(raf);
  $('st').textContent = '準備中…';
  const raw = new Uint8Array(await file.arrayBuffer());
  const zipped = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  if (my !== run) return;  // 準備中にファイルか密度が変更された
  const z = zipped.length < raw.length ? 1 : 0;  // 小さくなるときだけ圧縮
  const body = z ? zipped : raw;
  const meta = new TextEncoder().encode(JSON.stringify({ n: file.name.slice(0, 80), s: raw.length, c: crc(raw), z, t: file.type, l: body.length }));
  ver = +$('ver').value;
  CH = CAP[ver] - HDR & ~3; L = CH / 4;
  const len = 2 + meta.length + body.length;  // [メタ長 2B][メタ][本体] を CH バイトずつのブロックに分ける
  const k = Math.ceil(len / CH);
  if (k > 65535) { $('st').textContent = 'ファイルが大きすぎます'; return; }
  const u8 = new Uint8Array(k * CH);
  u8[0] = meta.length >> 8; u8[1] = meta.length & 255; u8.set(meta, 2); u8.set(body, 2 + meta.length);
  crypto.getRandomValues(u8.subarray(len));  // 余りは乱数で埋める(マスク固定でも模様が偏らないように)
  src = new Uint32Array(u8.buffer); K = k;
  id = crypto.getRandomValues(new Uint8Array(4));
  seq = 0; last = 0; t0 = performance.now();
  navigator.wakeLock?.request('screen').catch(() => {});  // 転送中にモニターが消えないように
  raf = requestAnimationFrame(loop);
}

function frame(q) {  // q < K は元のブロック、q >= K は約半数のブロックのXOR(どの K 枚+数枚からでも復元できる)
  const b = new Uint8Array(HDR + CH), acc = new Uint32Array(L), dv = new DataView(b.buffer);
  if (q < K) acc.set(src.subarray(q * L, q * L + L));
  else {
    const m = mask(q, K, new Uint32Array(K + 31 >> 5));
    for (let i = 0; i < K; i++)
      if (m[i >> 5] >>> (i & 31) & 1) for (let j = 0, o = i * L; j < L; j++) acc[j] ^= src[o + j];
  }
  b[0] = 0xF2; b.set(id, 1); dv.setUint32(5, q); dv.setUint16(9, K);
  b.set(new Uint8Array(acc.buffer), HDR);
  return b;
}

function loop(t) {  // 画面の更新に合わせて切り替える(setTimeoutだと表示時間が1枚ごとにばらつく)
  raf = requestAnimationFrame(loop);
  const fps = +$('sp').value;
  if (t - last < 1000 / fps - 4) return;
  last = t;
  const code = generate(mode.bytes(frame(seq)), { minVersion: ver, maxVersion: ver, minCorrectionLevel: correction.L, maxCorrectionLevel: correction.L, mask: 0 });
  code.toCanvas(cv, { pad: 4, off: [255, 255, 255] });  // 1モジュール=1ピクセルで描き、拡大はCSSに任せる
  if (cv.width !== size) { size = cv.width; layout(); }
  seq++;
  const sec = Math.max(0, (t - t0) / 1000 | 0);
  $('st').textContent = `送信 ${seq}枚（必要 ${K}枚）・ 経過 ${sec / 60 | 0}:${String(sec % 60).padStart(2, '0')}`;
}

function layout() {  // 1モジュールを整数デバイスピクセルにする
  if (!size) return;
  const dpr = devicePixelRatio, room = Math.min(innerWidth, innerHeight - $('bar').offsetHeight) - 16;
  const px = Math.max(1, Math.floor(room * dpr / size));
  cv.style.width = cv.style.height = size * px / dpr + 'px';
}

$('f').addEventListener('change', start);
$('ver').addEventListener('change', start);
$('sp').addEventListener('input', () => $('fo').value = $('sp').value);
addEventListener('resize', layout);
</script>
