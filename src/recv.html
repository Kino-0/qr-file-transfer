<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR受信</title>
<style>
  body{margin:0;padding:12px;display:flex;flex-direction:column;gap:10px;font:16px system-ui,sans-serif}
  button,#out a{display:block;font-size:18px;padding:12px;text-align:center}
  video{width:min(100%,55vh);aspect-ratio:1;margin:auto;background:#000;object-fit:cover}  /* 表示＝読み取り範囲 */
  progress{width:100%;height:24px}
  #er{color:#c00}
</style>
<button id="go">カメラ開始</button>
<video id="v" playsinline muted></video>
<progress id="pg" value="0" max="1"></progress>
<div id="st">待機中</div>
<div id="er"></div>
<div id="out"></div>
<script>/*@inline zxing-reader*/</script>
<script>
const MAX = 1080;  // 映像中央の正方形を縮小せずに読む(これより大きいときだけ縮小)
const HDR = 11;    // [F2][ID 4B][通番 4B][ブロック数 2B]
const OPT = { formats: ['QRCode'], tryHarder: true, tryRotate: false, tryInvert: false, tryDownscale: false, maxNumberOfSymbols: 1 };

const $ = id => document.getElementById(id);
const v = $('v'), cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
const T = new Uint32Array(256).map((_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ n >>> 1 : n >>> 1; return n; });
const crc = b => { let c = -1; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ c >>> 8; return (c ^ -1) >>> 0; };
const mask = (q, K, m) => {  // 送信側と同じ
  for (let i = 0, a = q; i < m.length; i++) {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    m[i] = t ^ t >>> 14;
  }
  if (K & 31) m[m.length - 1] &= (1 << (K & 31)) - 1;
  return m;
};
const ready = ZXingWASM.prepareZXingModule({ overrides: { wasmBinary: Uint8Array.from(atob('/*@wasm64*/'), c => c.charCodeAt(0)) }, fireImmediately: true });
let S, stream, timer;

function reset() { S = { id: -1, K: 0, CH: 0, rank: 0, piv: [], seen: new Set() }; $('pg').value = 0; $('st').textContent = '待機中'; }
function stop() { v.cancelVideoFrameCallback(timer); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

$('go').addEventListener('click', async () => {
  stop(); reset();
  $('er').textContent = ''; $('out').textContent = '';
  try {
    await ready;
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } } });
  } catch (e) { $('er').textContent = 'カメラを起動できません: ' + e.message; return; }
  const track = stream.getVideoTracks()[0];
  if (track.getCapabilities?.().focusMode?.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  v.srcObject = stream;
  await v.play();
  navigator.wakeLock?.request('screen').catch(() => {});
  timer = v.requestVideoFrameCallback(scan);
});

async function scan() {  // カメラの新しいフレームごとに1回(デコード中に来たフレームは自然に間引かれる)
  if (!stream) return;
  const w = v.videoWidth, h = v.videoHeight, s = Math.min(w, h), d = Math.min(s, MAX);
  if (cv.width !== d) cv.width = cv.height = d;
  cx.drawImage(v, (w - s) / 2, (h - s) / 2, s, s, 0, 0, d, d);
  const [code] = await ZXingWASM.readBarcodes(cx.getImageData(0, 0, d, d), OPT);
  if (!stream) return;
  if (code?.bytes) take(code.bytes);
  if (S.K && S.rank === S.K) return finish();
  timer = v.requestVideoFrameCallback(scan);
}

function take(b) {  // 1枚 = ブロックの連立方程式(GF(2))の1行。届くたびに掃き出す
  if (b.length < HDR + 4 || b[0] !== 0xF2 || (b.length - HDR) % 4) return;
  const dv = new DataView(b.buffer, b.byteOffset), id = dv.getUint32(1), q = dv.getUint32(5), K = dv.getUint16(9), CH = b.length - HDR;
  if (id !== S.id || K !== S.K || CH !== S.CH) { reset(); Object.assign(S, { id, K, CH }); $('pg').max = K; }  // 別の転送ならやり直し
  if (!K || S.rank === K || S.seen.has(q)) return;
  S.seen.add(q);
  const W = K + 31 >> 5, R = W + CH / 4, row = new Uint32Array(R);  // [係数ビット W語][データ]
  if (q < K) row[q >> 5] = 1 << (q & 31); else mask(q, K, row.subarray(0, W));
  new Uint8Array(row.buffer, W * 4).set(b.subarray(HDR));
  for (let w = 0; w < W; w++)
    while (row[w]) {
      const c = w * 32 + 31 - Math.clz32(row[w] & -row[w]), p = S.piv[c];
      if (!p) { S.piv[c] = row; S.rank++; w = W; break; }  // 新しい情報だった
      for (let j = w; j < R; j++) row[j] ^= p[j];
    }
  $('pg').value = S.rank;
  $('st').textContent = `受信 ${S.rank}/${K}`;
}

async function finish() {
  try {
    const { K, CH, piv } = S, W = K + 31 >> 5, R = W + CH / 4, out = new Uint8Array(K * CH);
    for (let c = K - 1; c >= 0; c--) {  // 後退代入
      const row = piv[c];
      for (let w = c >> 5; w < W; w++) {
        let x = row[w]; if (w === c >> 5) x &= ~(1 << (c & 31));
        for (; x; x &= x - 1) { const p = piv[w * 32 + 31 - Math.clz32(x & -x)]; for (let j = W; j < R; j++) row[j] ^= p[j]; }
      }
      out.set(new Uint8Array(row.buffer, W * 4), c * CH);
    }
    const ml = out[0] << 8 | out[1], m = JSON.parse(new TextDecoder().decode(out.subarray(2, 2 + ml)));
    let d = out.subarray(2 + ml, 2 + ml + m.l);
    if (m.z) d = new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    if (crc(d) !== m.c) throw Error('チェックサム不一致');
    stop();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([d], { type: m.t || 'application/octet-stream' }));
    a.download = m.n || 'download';
    a.textContent = `保存: ${m.n} (${m.s.toLocaleString()} バイト)`;
    $('out').replaceChildren(a);
    $('st').textContent = '受信完了';
    $('er').textContent = '';
  } catch (e) {
    $('er').textContent = 'エラー: ' + e.message + '(最初から受信し直します)';
    reset();
    timer = v.requestVideoFrameCallback(scan);
  }
}
</script>
